[project]
name = "smarthire-showcase"
version = "1.1.0"
description = "SmartHire architecture patterns showcase — sanitized excerpts from a multi-tenant Telegram/Web SaaS platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# code/ holds excerpted samples — the only real third-party import there is
# SQLAlchemy. Internal `core.*` imports are illustrative and intentionally
# not resolvable here.
dependencies = [
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "bandit>=1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
