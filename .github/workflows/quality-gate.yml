---
name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

# This repository is a curated showcase: code/ contains sanitized excerpts,
# not a runnable application — internal imports (core.*, handlers/*) do not
# resolve here by design. CI therefore runs the checks that are meaningful
# on excerpts: ruff lint + bandit security scan. Type-checking, tests, and
# the full quality gate (ruff+semgrep+mypy+pytest+drift gates) run in the
# private repository where the codebase lives.

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Run ruff
        run: uv run ruff check .

  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Run bandit
        run: uv run bandit -r code/
